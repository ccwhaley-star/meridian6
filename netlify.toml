[build]
  publish = "."
  functions = "netlify/functions"

# The repo root is the publish folder; keep internal files off the web.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/flint-digital-seo-audit.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/flint-digital-design-audit.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/flint-digital-mobile-audit.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/og-image.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/og-image"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/api/audit"
  to = "/.netlify/functions/audit-start"
  status = 200

[[redirects]]
  from = "/api/audit-result"
  to = "/.netlify/functions/audit-result"
  status = 200

# Fonts never change without a filename change — cache hard.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images change rarely; a week of caching is safe (filenames change with content).
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Host-level 301s: legacy hostnames hand everything to the primary domain
[[redirects]]
  from = "https://www.flintdigital.ai/*"
  to = "https://meridian6.ai/:splat"
  status = 301
  force = true

# The site's own Netlify address (the name "meridian6" belongs to another
# Netlify site, so this one keeps its original name).
[[redirects]]
  from = "https://flint-digital.netlify.app/*"
  to = "https://meridian6.ai/:splat"
  status = 301
  force = true

# CSS/JS are cache-busted with ?v= query strings — cache hard.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/shared/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
